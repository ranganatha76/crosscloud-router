name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: go.sum
      - run: go mod verify
      - run: go test -race ./...
      - run: go vet ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - run: GOOS=linux GOARCH=amd64 go build ./cmd/router-agent
      - run: GOOS=linux GOARCH=arm64 go build ./cmd/router-agent
